on:
  push:
    branches:
      - main
name: 🚀 Deploy to Cloudflare Pages
jobs:
  deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 📥 Install dependencies
      run: npm ci

    - name: 🎨 Compile SCSS
      run: npm run prod

    - name: � Collect deploy files
      run: |
        mkdir dist
        cp *.html *.css *.svg _redirects dist/
        cp -r favicons dist/

    - name: 📂 Deploy to Cloudflare Pages
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        command: pages deploy dist --project-name=lsp-austria --commit-dirty=true
